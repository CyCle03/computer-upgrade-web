<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>'컴퓨터 강화하기' 웹 복원판 대시보드</title>
  <!-- 아이콘: SVG 를 우선 쓰고, 링크를 못 읽는 클라이언트가 자동으로 때리는
       /favicon.ico 도 함께 둔다(없으면 방문자마다 404 가 찍힌다).
       .ico 는 생성물 — 모양을 바꾸면 favicon.svg 와 함께 고치고
       `node scripts/build-favicon.js` 로 다시 만들 것. -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- 스타일: Tailwind + 셀프 호스팅 폰트 + 커스텀 CSS (frontend/src/styles.css → 빌드 산출물) -->
  <link rel="stylesheet" href="/build/app.css">
  <!-- 전역 스크립트 — 번들보다 먼저 실행돼야 한다(app.js가 window.OriginalMapGame 등을 최상단에서 읽음) -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/originalMapData.js"></script>
  <script src="/js/gameSync.js"></script>
  <script src="/js/autoSimulator.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen overflow-x-hidden selection:bg-emerald-500 selection:text-slate-950">

  <div id="root"></div>

  <!-- React UI 컴포넌트 마운트 -->
  <script src="/build/app.js" defer></script>
</body>
</html>
