<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>'컴퓨터 강화하기' 웹 복원판 대시보드</title>
  <!-- 스타일: Tailwind + 셀프 호스팅 폰트 + 커스텀 CSS (frontend/src/styles.css → 빌드 산출물) -->
  <link rel="stylesheet" href="/build/app.css">
  <!-- 전역 스크립트 — 번들보다 먼저 실행돼야 한다(app.js가 window.OriginalMapGame 등을 최상단에서 읽음) -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/originalMapData.js"></script>
  <script src="/js/gameSync.js"></script>
  <script src="/js/autoSimulator.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen overflow-x-hidden selection:bg-emerald-500 selection:text-slate-950">

  <!-- 구 duckdns 주소 종료 안내. 2026-08-07 이 지나면 legacyNotice.js 가 표시하지 않는다.
       완성형 Tailwind 클래스만 쓴다 — 쪼개 조합하면 빌드 시 스캔에 안 잡힌다. -->
  <div id="legacyNotice"
       class="hidden items-center gap-3 bg-amber-900/90 text-amber-50 text-sm px-4 py-2 border-b border-amber-600">
    <span class="flex-1">
      옛 주소(computer-upgrade-web.duckdns.org)는 <b>8월 7일</b>부터 접속할 수 없습니다.
      북마크를 <b>pc.elcherlab.com</b> 으로 바꿔주세요.
    </span>
    <button type="button" id="legacyNoticeClose" aria-label="닫기"
            class="shrink-0 rounded border border-amber-300/40 px-2 py-0.5 text-xs hover:bg-amber-100/15">✕</button>
  </div>

  <div id="root"></div>

  <!-- React UI 컴포넌트 마운트 -->
  <script src="/js/legacyNotice.js" defer></script>
  <script src="/build/app.js" defer></script>
</body>
</html>
